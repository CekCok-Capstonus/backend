services:
  postgres:
    image: postgres:16-alpine
    container_name: cekcok-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cekcok
    ports:
      - "5432:5432"
    volumes:
      - cekcok_pg_data:/var/lib/postgresql/data

volumes:
  cekcok_pg_data:
